
name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Lấy source code
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Cài đặt Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Cấu hình Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. Giải mã keystore cố định
      # Đặt tại thư mục gốc vì signingConfig đang tìm debug.keystore ở đây
      - name: Setup Fixed Debug Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: Missing DEBUG_KEYSTORE_BASE64 secret"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > debug.keystore

          test -s debug.keystore

          echo "Keystore installed successfully!"

      # 5. Kiểm tra SHA của keystore
      - name: Show Keystore Fingerprints
        run: |
          keytool -list -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey

      # 6. Chuẩn bị Firebase
      # Luôn copy file mới, không sử dụng file cũ trong app
      - name: Prepare Firebase config
        run: |
          mkdir -p app

          cp public/assets/aistudio/google-services_13d46ad6.json \
             app/google-services.json

          test -s app/google-services.json

      # 7. Kiểm tra Firebase package name
      - name: Verify Firebase config
        run: |
          python3 - <<'PY'
          import json

          with open("app/google-services.json") as f:
              data = json.load(f)

          packages = [
              client["client_info"]["android_client_info"]["package_name"]
              for client in data["client"]
          ]

          print("Firebase packages:", packages)

          if "com.android.proxyflow" not in packages:
              raise SystemExit("ERROR: Firebase package name mismatch!")

          print("Firebase configuration is correct!")
          PY

      # 8. Build APK
      - name: Build Debug APK
        run: gradle assembleDebug

      # 9. Kiểm tra chữ ký APK
      - name: Verify APK Signature
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          APKSIGNER=$(find "$SDK/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found"
            exit 1
          fi

          "$APKSIGNER" verify --print-certs "$APK"

      # 10. Đổi tên APK
      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/Proxy-Flow.apk

      # 11. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Proxy-Flow
          path: app/build/outputs/apk/debug/Proxy-Flow.apk
          if-no-files-found: error
